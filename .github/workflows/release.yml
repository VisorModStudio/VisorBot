name: Build & Release VisorBot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Build Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup vcpkg (pinned to builtin-baseline)
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/vcpkg"
          git -C "${{ github.workspace }}/vcpkg" checkout ea1a7396b05637a53bf23c078647ecc0edee4b80
          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_INSTALLATION_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

      - name: Patch dpp port for static build
        run: |
          # Copy the original dpp port to an overlay directory
          mkdir -p overlay-ports/dpp
          cp -r "${{ github.workspace }}/vcpkg/ports/dpp/"* overlay-ports/dpp/

          # Patch the portfile to force BUILD_SHARED_LIBS=OFF
          sed -i 's/vcpkg_cmake_configure(/vcpkg_cmake_configure(\n    OPTIONS\n        -DBUILD_SHARED_LIBS=OFF\n        -DRUN_LDCONFIG=OFF\n        -DDPP_INSTALL=ON\n        -DDPP_BUILD_TEST=OFF/' overlay-ports/dpp/portfile.cmake

          echo "=== Patched portfile.cmake ==="
          cat overlay-ports/dpp/portfile.cmake

      - name: Restore/Cache vcpkg Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-static-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-static-v2-

      - name: Build Project via CMake & vcpkg
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_OVERLAY_PORTS=overlay-ports \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release

      - name: Verify Binary Linkage
        run: |
          echo "=== Linked libraries ==="
          ldd build/VisorBot || echo "(statically linked - no dynamic dependencies)"
          echo ""
          echo "=== Check for dynamic libdpp ==="
          if ldd build/VisorBot 2>/dev/null | grep -q "libdpp"; then
            echo "ERROR: libdpp is still dynamically linked!"
            ldd build/VisorBot | grep libdpp
            exit 1
          else
            echo "OK: libdpp is statically linked."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: build/VisorBot